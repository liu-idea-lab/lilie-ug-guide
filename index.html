<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://entrepreneurship.rice.edu/">
<link rel="canonical" href="https://entrepreneurship.rice.edu/">
<title>Liu Idea Lab for Innovation &amp; Entrepreneurship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0037A6;--ink:#000;--paper:#fff}
body{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:15px;line-height:1.7;color:var(--ink);background:var(--paper);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
}
main{max-width:520px}
h1{
  font-size:12px;font-weight:500;color:var(--navy);
  text-transform:uppercase;letter-spacing:.18em;margin-bottom:20px;
}
p{margin-bottom:20px}
a{
  display:inline-block;background:var(--navy);color:var(--paper);
  padding:12px 24px;text-decoration:none;font-weight:500;
  text-transform:uppercase;letter-spacing:.1em;font-size:12px;
}
a:hover{background:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Liu Idea Lab for Innovation &amp; Entrepreneurship</h1>
  <p>Undergraduate courses, programs, and events now live on the Lilie site.</p>
  <p><a href="https://entrepreneurship.rice.edu/">entrepreneurship.rice.edu</a></p>
</main>
<script>window.location.replace('https://entrepreneurship.rice.edu/');</script>
</body>
</html>
